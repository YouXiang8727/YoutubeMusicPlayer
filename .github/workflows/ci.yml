name: CI

# 唯一的品質關卡：所有 PR 與 master push 都必須跑編譯＋單元測試。
# status check 名稱為「CI / build-and-test」，與 TEAM.md §3 Branch Protection 要求一致。

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle（內建 gradle cache）
        uses: gradle/actions/setup-gradle@v4

      - name: Build & unit test
        run: ./gradlew test assembleDebug --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7